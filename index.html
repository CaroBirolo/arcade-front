<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetroVerse - Juegos Retro Online Gratis</title>

    <link rel="canonical" href="https://www.retroverse.cc/" />
    <link rel="alternate" hreflang="es" href="https://retroverse.cc/es/" />
    <link rel="alternate" hreflang="en" href="https://retroverse.cc/en/" />
    <link rel="alternate" hreflang="pt-BR" href="https://retroverse.cc/pt-br/" />
    <link rel="alternate" hreflang="x-default" href="https://retroverse.cc/es/" />
    <meta name="description" content="Juegos retro online gratis. Selecciona tu idioma para comenzar.">
</head>

<body style="background-color: #000; color: #fff; font-family: sans-serif; margin: 0;">

    <div id="loading-screen" style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column;">
        <img src="/imagenes/LOGOS/logo-sin-fonfo.png" alt="RetroVerse" style="max-width: 200px; margin-bottom: 20px;">
        <p>Cargando Juego...</p>
    </div>

    <div id="game-canvas" style="display: none; padding: 20px; text-align: center;">
        <h1 id="game-title"></h1>
        <div id="game-content">
            </div>
    </div>

</body>

</body>
<script>
    (function () {
        const path = window.location.pathname;
        
        // Si ya estamos dentro de una carpeta de idioma, no hacemos nada 
        // (Esto evita bucles infinitos si el servidor se confunde)
        if (path.startsWith("/es/") || path.startsWith("/en/") || path.startsWith("/pt-br/")) {
            return;
        }

        // Detectamos el idioma del navegador
        const userLang = (navigator.language || navigator.userLanguage || "es").toLowerCase();
        let langFolder = "/es/"; // Por defecto

        if (userLang.startsWith("pt")) {
            langFolder = "/pt-br/";
        } else if (userLang.startsWith("en")) {
            langFolder = "/en/";
        }

        // CONSTRUIMOS LA REDIRECCIÓN:
        // Si el usuario entró a: /juego/nombre-juego
        // Lo mandamos a: /es/juego/nombre-juego
        const newPath = langFolder + path.replace(/^\//, "");
        
        window.location.replace(newPath);
    })();
</script>

</html>
